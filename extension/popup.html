<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClassPano Sync</title>
    <style>
      :root { --void:#000; --paper:#fff; --jade:#00c27a; --mint:#b4f5c8; --leaf:#d5f8e0; --leaf-ink:#007b3b; --fog:#f3f3f3; --ash:#eee; --line:#dce1e5; --muted:#626262; --ink:#333; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { width: 360px; font: 13.5px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--void); background: var(--paper); }
      header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      header img { width: 28px; height: 28px; }
      header b { display: block; font-size: 14px; }
      header small { display: block; color: var(--muted); font-size: 11.5px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      main { padding: 14px; max-height: 480px; overflow-y: auto; }
      h1 { font: 300 24px/1.1 Georgia, serif; letter-spacing: -0.02em; margin: 6px 0 10px; }
      .eyebrow { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      ul.rules { list-style: none; display: grid; gap: 7px; margin: 10px 0 12px; }
      ul.rules li { display: flex; gap: 8px; }
      ul.rules i { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
      .ok { background: var(--leaf); color: var(--leaf-ink); } .no { background: #ffe4e6; color: #9f1239; }
      .box { background: var(--fog); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
      .warn { background: #fff6dd; }
      button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; height: 38px; padding: 0 14px; font-weight: 600; width: 100%; }
      .primary { background: var(--jade); color: var(--void); }
      .primary:hover { filter: brightness(0.93); }
      .dark { background: var(--void); color: var(--paper); }
      .ghost { background: transparent; color: var(--muted); font-weight: 500; }
      .outline { background: var(--paper); border: 1.5px solid var(--line); }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
      .tiles div { background: var(--fog); border-radius: 10px; padding: 8px 2px; }
      .tiles .hi { background: var(--leaf); }
      .tiles b { display: block; font: 300 24px/1 Georgia, serif; }
      .tiles span { font-size: 10.5px; color: var(--muted); }
      .changes { list-style: none; display: grid; gap: 6px; }
      .changes li { border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 12.5px; }
      .changes li b { display: block; font-size: 13px; }
      .cand { display: flex; gap: 8px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 6px; }
      .cand input { margin-top: 3px; accent-color: #000; }
      .cand small { display: block; color: var(--muted); font-size: 11.5px; }
      .muted { color: var(--muted); }
      footer { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
      a { color: var(--leaf-ink); }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" alt="" />
      <div><b>ClassPano Sync</b><small id="host">Prototype · v0.4.0</small></div>
    </header>
    <main id="app"></main>
    <footer><span>Reads only this tab, only when you click.</span><span id="count"></span></footer>
    <script src="popup.js"></script>
  </body>
</html>
